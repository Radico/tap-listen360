[tool.poetry]
name = "tap-listen360"
version = "0.1.2"
description = "Singer.io tap for extracting data from Eloqua"
authors = ["Simon Data"]
license = "Apache License 2.0"

[tool.poetry.dependencies]
python = "^3.9"
singer-python = "6.1.1"
requests = "2.32.3"
pendulum = "3.0.0"
xmltodict = "0.11.0"
tap-kit = { version = "0.1.2", source="artifactory" }

[[tool.poetry.source]]
name = "artifactory"
url = "https://simondata.jfrog.io/artifactory/api/pypi/pypi/simple"
secondary = true

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-listen360 = "tap_listen360:main"

[tool.poetry.plugins]

[tool.poetry.plugins."tap-listen360"]
"tap-listen360" = "tap_listen360:main"
